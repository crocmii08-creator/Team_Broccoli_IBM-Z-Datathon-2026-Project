<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaki companion preview</title><style>*{box-sizing:border-box}body{margin:0;padding:40px;background:#f5f7f9;color:#173e39;font:16px system-ui}h1{margin:0 0 12px;font-size:28px}p{margin:0 0 32px}main{display:flex;gap:32px;flex-wrap:wrap}figure{margin:0;min-width:180px;padding:24px;display:grid;justify-items:center;gap:20px}figcaption{font-size:14px}.dark{background:#173e39;color:white;border-radius:16px}.alert{background:#c8283a;color:white;border-radius:16px}/* Kaki's line-drawn companion: a clear, expressive face at every size. */
.kaki-companion{--kaki-ink:#0E8F7E;width:64px;height:64px;flex:0 0 64px;position:relative;filter:drop-shadow(0 2px 2px rgba(0,50,43,.14));pointer-events:none}
.kaki-companion svg{display:block;width:100%;height:100%;overflow:visible}
.kaki-face,.kaki-face-outline{fill:none;stroke:var(--kaki-ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.kaki-face-outline{stroke:#fff;stroke-width:8.5}
.kaki-eyes{transform-box:fill-box;transform-origin:center;animation:kaki-blink 6s ease-in-out infinite}
.kaki-eyes--concerned,.kaki-mouth--concerned{display:none}
.kaki-companion--rest{padding:8px}
#phone-viewport:has(#kaki-bubble-wrap.show) .kaki-companion--rest{visibility:hidden}
#kaki-bubble-wrap{bottom:178px;gap:8px;align-items:flex-end}
#phone-viewport:has(#kaki-scam-panel[style*="display: block"],#kaki-amber-panel[style*="display: block"]) #kaki-bubble-wrap,#phone-viewport:has(#kaki-scam-panel[style*="display: block"],#kaki-amber-panel[style*="display: block"]) .kaki-companion--rest{visibility:hidden}
#kaki-bubble{min-width:0;font-size:17px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
#scam-bubble-row .kaki-companion{width:64px;height:64px;flex-basis:64px}
#scam-bubble-txt{font-size:17px!important;line-height:1.4!important}
.kaki-companion--alert{--kaki-ink:#173E39;filter:drop-shadow(0 2px 2px rgba(60,0,0,.15))}
.kaki-companion--alert .kaki-face-outline{stroke:#FFC21A}
.kaki-companion--alert .kaki-eyes--happy,.kaki-companion--alert .kaki-mouth--smile{display:none}
.kaki-companion--alert .kaki-eyes--concerned,.kaki-companion--alert .kaki-mouth--concerned{display:block}
.kaki-mouth--smile{transform-box:fill-box;transform-origin:center}
.kaki-companion.is-speaking .kaki-mouth--smile{animation:kaki-talk .48s ease-in-out infinite alternate}
@keyframes kaki-blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}
@keyframes kaki-talk{from{transform:scaleY(.65)}to{transform:scaleY(1.3)}}
@media(prefers-reduced-motion:reduce){.kaki-companion .kaki-eyes,.kaki-companion.is-speaking .kaki-mouth--smile{animation:none}}
</style><h1>Meet Kaki.</h1><p>A little face, right beside you.</p><main><figure><div class="kaki-companion" role="img" aria-label="Kaki smiling"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g class="kaki-face-outline"><path class="kaki-eyes kaki-eyes--happy" d="M9 29 18 19 27 29M37 29 46 19 55 29"></path><path class="kaki-eyes--concerned" d="m10 29 16-6m12 0 16 6"></path><path class="kaki-mouth kaki-mouth--smile" d="M24 40q8 10 16 0"></path><path class="kaki-mouth--concerned" d="M25 44q7-7 14 0"></path></g><g class="kaki-face"><path class="kaki-eyes kaki-eyes--happy" d="M9 29 18 19 27 29M37 29 46 19 55 29"></path><path class="kaki-eyes--concerned" d="m10 29 16-6m12 0 16 6"></path><path class="kaki-mouth kaki-mouth--smile" d="M24 40q8 10 16 0"></path><path class="kaki-mouth--concerned" d="M25 44q7-7 14 0"></path></g></svg></div><figcaption>Ready to help</figcaption></figure><figure><div class="kaki-companion is-speaking" role="img" aria-label="Kaki speaking"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g class="kaki-face-outline"><path class="kaki-eyes kaki-eyes--happy" d="M9 29 18 19 27 29M37 29 46 19 55 29"></path><path class="kaki-eyes--concerned" d="m10 29 16-6m12 0 16 6"></path><path class="kaki-mouth kaki-mouth--smile" d="M24 40q8 10 16 0"></path><path class="kaki-mouth--concerned" d="M25 44q7-7 14 0"></path></g><g class="kaki-face"><path class="kaki-eyes kaki-eyes--happy" d="M9 29 18 19 27 29M37 29 46 19 55 29"></path><path class="kaki-eyes--concerned" d="m10 29 16-6m12 0 16 6"></path><path class="kaki-mouth kaki-mouth--smile" d="M24 40q8 10 16 0"></path><path class="kaki-mouth--concerned" d="M25 44q7-7 14 0"></path></g></svg></div><figcaption>Speaking</figcaption></figure><figure class="dark"><div class="kaki-companion" role="img" aria-label="Kaki on a dark screen"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g class="kaki-face-outline"><path class="kaki-eyes kaki-eyes--happy" d="M9 29 18 19 27 29M37 29 46 19 55 29"></path><path class="kaki-eyes--concerned" d="m10 29 16-6m12 0 16 6"></path><path class="kaki-mouth kaki-mouth--smile" d="M24 40q8 10 16 0"></path><path class="kaki-mouth--concerned" d="M25 44q7-7 14 0"></path></g><g class="kaki-face"><path class="kaki-eyes kaki-eyes--happy" d="M9 29 18 19 27 29M37 29 46 19 55 29"></path><path class="kaki-eyes--concerned" d="m10 29 16-6m12 0 16 6"></path><path class="kaki-mouth kaki-mouth--smile" d="M24 40q8 10 16 0"></path><path class="kaki-mouth--concerned" d="M25 44q7-7 14 0"></path></g></svg></div><figcaption>On a dark screen</figcaption></figure><figure class="alert"><div class="kaki-companion kaki-companion--alert" role="img" aria-label="Kaki concerned"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g class="kaki-face-outline"><path class="kaki-eyes kaki-eyes--happy" d="M9 29 18 19 27 29M37 29 46 19 55 29"></path><path class="kaki-eyes--concerned" d="m10 29 16-6m12 0 16 6"></path><path class="kaki-mouth kaki-mouth--smile" d="M24 40q8 10 16 0"></path><path class="kaki-mouth--concerned" d="M25 44q7-7 14 0"></path></g><g class="kaki-face"><path class="kaki-eyes kaki-eyes--happy" d="M9 29 18 19 27 29M37 29 46 19 55 29"></path><path class="kaki-eyes--concerned" d="m10 29 16-6m12 0 16 6"></path><path class="kaki-mouth kaki-mouth--smile" d="M24 40q8 10 16 0"></path><path class="kaki-mouth--concerned" d="M25 44q7-7 14 0"></path></g></svg></div><figcaption>Looking out for you</figcaption></figure></main></html>
