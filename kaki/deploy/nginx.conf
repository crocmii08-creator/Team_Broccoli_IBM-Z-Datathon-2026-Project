# Serves the demo and proxies API calls to the backend on the same origin,
# so kaki-demo.html automatically switches to LinuxONE API scoring.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / { try_files /kaki-demo.html =404; }

    location /api/ {
        proxy_pass http://kaki-backend:5001;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /score {
        proxy_pass http://kaki-backend:5001;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
